<style>
/* Layout: sticky header with scrollable tab strip; single column of cards on phone, two columns on desktop. White-city Bauhaus: plaster white, sea blue, sun yellow. */
:root{
  --bg:#F4F7FA; --surface:#FFFFFF; --surface-2:#EEF2F7; --ink:#14213A; --muted:#5B6880; --line:#DCE3EC;
  --accent:#1F5AA6; --accent-ink:#FFFFFF; --accent-soft:#E3ECF8; --sun:#F2B33D; --sun-ink:#3A2A05;
  --good:#2E8B57; --good-soft:#E2F3EA; --warn:#B8741A; --warn-soft:#FBF0DF; --bad:#B93B35; --bad-soft:#F8E4E2;
  --wa:#1F9E57;
  --f-display:"Rubik",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --f-body:"Rubik",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1420; --surface:#152035; --surface-2:#1B2840; --ink:#E6ECF5; --muted:#9AA8BE; --line:#27354E;
  --accent:#78A9EE; --accent-ink:#0D1420; --accent-soft:#1C2D4A; --sun:#F2C266; --sun-ink:#2A1E03;
  --good:#5CC48A; --good-soft:#163326; --warn:#E3A54F; --warn-soft:#352812; --bad:#EE7B74; --bad-soft:#3A1A1A; --wa:#3CC57A;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1420; --surface:#152035; --surface-2:#1B2840; --ink:#E6ECF5; --muted:#9AA8BE; --line:#27354E;
  --accent:#78A9EE; --accent-ink:#0D1420; --accent-soft:#1C2D4A; --sun:#F2C266; --sun-ink:#2A1E03;
  --good:#5CC48A; --good-soft:#163326; --warn:#E3A54F; --warn-soft:#352812; --bad:#EE7B74; --bad-soft:#3A1A1A; --wa:#3CC57A;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;padding-block:12px 6px}
.logo{width:34px;height:34px;flex:none}
.brand h1{font-family:var(--f-display);font-size:1.25rem;margin:0;font-weight:700;letter-spacing:-.01em}
.brand .he{font-weight:500;color:var(--muted);font-size:.95rem;margin-inline-start:6px}
.sync{margin-inline-start:auto;font-size:.75rem;color:var(--muted);display:flex;align-items:center;gap:6px;text-align:end}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:var(--good)}.dot.warn{background:var(--warn)}
nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:8px}
nav::-webkit-scrollbar{display:none}
nav a{flex:none;text-decoration:none;color:var(--muted);font-weight:500;padding:7px 12px;border-radius:999px;font-size:.92rem}
nav a[aria-current="page"]{background:var(--ink);color:var(--surface)}
nav a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding-block:18px 60px}
h2{font-family:var(--f-display);font-size:1.15rem;margin:0;text-wrap:balance}
h3{font-family:var(--f-display);font-size:1rem;margin:0}
.muted{color:var(--muted)}
.small{font-size:.83rem}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:820px){.grid2{grid-template-columns:1fr 1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media(max-width:560px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.kpi b{display:block;font-family:var(--f-mono);font-size:1.35rem;font-variant-numeric:tabular-nums}
.kpi span{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
button,.btn{font:inherit;font-weight:500;font-size:.9rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 12px;border-radius:8px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;line-height:1.2}
button:hover,.btn:hover{border-color:var(--accent)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-wa{background:var(--wa);border-color:var(--wa);color:#fff}
.btn-ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn-danger{color:var(--bad)}
button[disabled]{opacity:.5;cursor:not-allowed}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:5px 11px;font-size:.84rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:90px;line-height:1.5}
label{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--muted);font-weight:500;min-width:0}
label.check{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-size:.9rem;font-weight:400}
label.check input{width:18px;height:18px;flex:none;accent-color:var(--accent)}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:700px){.fields{grid-template-columns:repeat(4,minmax(0,1fr))}}
.fields .wide{grid-column:1/-1}
.cards{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:820px){.cards{grid-template-columns:1fr 1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px;cursor:pointer;min-width:0;text-align:start;color:inherit;font:inherit}
.card:hover{border-color:var(--accent)}
.card-top{display:flex;gap:10px;align-items:flex-start}
.score{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-weight:500;font-size:.95rem;border:3px solid var(--line)}
.score.hi{border-color:var(--good);color:var(--good)}.score.mid{border-color:var(--sun);color:var(--warn)}.score.lo{border-color:var(--bad);color:var(--bad)}
.card h3{overflow-wrap:anywhere}
.price{font-family:var(--f-mono);font-size:1.05rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:.75rem;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.tag.good{background:var(--good-soft);color:var(--good)}.tag.bad{background:var(--bad-soft);color:var(--bad)}.tag.warn{background:var(--warn-soft);color:var(--warn)}
.status{font-size:.75rem;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.status.signe{background:var(--good-soft);color:var(--good)}.status.refuse{background:var(--bad-soft);color:var(--bad)}.status.repere{background:var(--surface-2);color:var(--muted)}
.alert{border-radius:var(--r);padding:10px 12px;background:var(--warn-soft);color:var(--ink);border:1px solid var(--line);font-size:.9rem}
.alert.info{background:var(--accent-soft)}
.empty{text-align:center;padding:28px 14px;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
.list{display:flex;flex-direction:column}
.list > *{padding-block:9px;border-bottom:1px solid var(--line)}
.list > *:last-child{border-bottom:0}
dialog{border:0;padding:0;border-radius:14px;background:var(--bg);color:var(--ink);width:min(760px,100vw - 16px);max-height:calc(100dvh - 24px);overflow:auto}
dialog::backdrop{background:rgba(10,15,25,.55)}
.sheet-head{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);padding:12px 14px;display:flex;gap:10px;align-items:center;z-index:2}
.sheet-body{padding:14px;display:flex;flex-direction:column;gap:14px}
.msgbox{display:flex;flex-direction:column;gap:8px}
.msgbox textarea{min-height:150px;font-size:.95rem}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:6px 10px;font-size:.84rem}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-size:.9rem;z-index:50;max-width:calc(100vw - 32px)}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--warn-soft);padding:8px 10px;border-radius:8px;font-size:.88rem}
.src a{color:var(--accent);font-weight:500}
.thumb{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:8px;background:var(--surface-2);display:block}
.gallery{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px}
.gallery img{flex:none;width:min(82%,420px);aspect-ratio:4/3;object-fit:cover;border-radius:10px;scroll-snap-align:start;background:var(--surface-2)}
.notel{background:var(--surface-2);border-radius:8px;padding:10px}
.he-text{direction:rtl;text-align:right;font-size:1rem}
.timeline{font-size:.83rem;color:var(--muted)}
.timeline div{display:flex;gap:8px}
.timeline .num{flex:none}
a{color:var(--accent)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<header>
  <div class="wrap">
    <div class="brand">
      <svg class="logo" viewBox="0 0 34 34" aria-hidden="true"><rect x="1" y="1" width="32" height="32" rx="8" fill="var(--accent)"/><rect x="8" y="9" width="18" height="17" rx="1.5" fill="none" stroke="var(--accent-ink)" stroke-width="2"/><path d="M8 15h18M14 15v11M20 15v11" stroke="var(--accent-ink)" stroke-width="2"/><circle cx="25" cy="8" r="3.2" fill="var(--sun)"/></svg>
      <h1>Dira Tel Aviv<span class="he">דירה</span></h1>

    <nav id="nav" aria-label="Sections">

</header>

<main class="wrap" id="main"></main>

<dialog id="sheet" aria-label="Fiche appartement"></dialog>
<div class="toast" id="toast" hidden></div>

<script>
"use strict";
/* ---------- constants ---------- */
const STATUSES=[
 ["repere","Repéré"],["contacte","Contacté"],["reponse","A répondu"],["visite_prevue","Visite prévue"],
 ["visite","Visité"],["dossier","Dossier envoyé"],["nego","Négociation"],["signe","Signé 🎉"],["refuse","Abandonné"]];
const STATUS_LABEL=Object.fromEntries(STATUSES);
const QUARTIERS=["Lev Ha'ir (centre)","Vieux Nord","Nouveau Nord","Florentin","Neve Tzedek","Kerem HaTeimanim","Montefiore / Rothschild","Kikar HaMedina","Bavli","Yad Eliyahu","Sarona / Kirya","Shapira / Sud","Ramat Hahayal","Autre"];
const FAV_Q=["Lev Ha'ir (centre)","Vieux Nord","Florentin","Neve Tzedek","Kerem HaTeimanim","Montefiore / Rothschild","Nouveau Nord"];
const SOURCES=["Yad2","Madlan","Homeless","Komo","Facebook","Agence","WhatsApp","Bouche à oreille","Autre"];
const VISIT_CHECK=[
 ["mamad","Mamad (ממ״ד) dans l'appart, ou abri (מקלט) à moins de 1 min"],
 ["eau","Pression de l'eau + eau chaude (ouvrir douche et évier)"],
 ["dud","Chauffe-eau / dud shemesh : âge, minuteur, solaire ?"],
 ["humid","Humidité, moisissures, traces d'infiltration (plafonds, coins, salle de bain)"],
 ["clim","Clim dans chaque pièce ? Âge, télécommandes, qui paie l'entretien"],
 ["fenetres","Fenêtres et volets (trissim) : ferment bien ? Moustiquaires ?"],
 ["bruit","Bruit : rue, bars, chantier, voisins (revenir le soir si possible)"],
 ["soleil","Orientation / lumière ; appart traversant ?"],
 ["elec","Prises, tableau électrique, wifi / fibre disponible"],
 ["cuisine","Cuisine : plaques, four, frigo inclus ? Machine à laver ?"],
 ["cafards","Cafards / nuisibles : regarder sous l'évier"],
 ["escalier","Escalier, ascenseur (ascenseur de Shabbat ?), état des parties communes"],
 ["poubelles","Poubelles, local vélo, stockage"],
 ["tama","Chantier TAMA 38 / pinui binui prévu dans l'immeuble ou à côté ?"],
 ["inclus","Liste écrite des appareils qui restent (frigo, clim, machine…)"],
 ["photos","Photos + vidéo de tout l'appart (état des lieux)"],
 ["charges","Montant exact arnona + vaad bayit demandé et noté"],
 ["garanties","Garanties demandées (chèques, garants, garantie bancaire) notées"],
];
const DOSSIER=[
 ["Identité",[["passeports","Passeports (toi + ta cousine)"],["teudat_ole","Teudat olé (תעודת עולה)"],["teudat_zehut","Teudat zehut (ת״ז) ou numéro provisoire"]]],
 ["Argent",[["compte","Compte bancaire israélien ouvert"],["chequier","Carnet de chèques (indispensable pour loyer + garanties)"],["revenus","Preuve de revenus : fiches de paie, contrat, relevés FR, ou lettre employeur"],["epargne","Relevé d'épargne (rassure quand pas encore de salaire israélien)"],["sal_klita","Attestation sal klita / Misrad HaKlita"]]],
 ["Garanties",[["arevim","2 garants (ערבים) avec salaire israélien, si possible"],["garantie_banc","Garantie bancaire (ערבות בנקאית) possible : demander à la banque combien de mois"],["depot","Dépôt / chèque de garantie prêt (écrire dessus : לא להפקדה ללא הודעה מראש בכתב)"],["alt_garantie","Plan B sans garants : 3-6 mois d'avance, société de garantie ou assurance loyer"]]],
 ["Présentation",[["lettre","Petite présentation en hébreu + anglais (dans l'app)"],["dispos","Créneaux de visite des 7 prochains jours"],["contact","Numéro israélien + WhatsApp actif"]]],
 ["Avant de signer",[["bail","Faire relire le bail (חוזה שכירות) par un avocat ou un ami israélien"],["clause","Clause de sortie anticipée + option de prolongation"],["etat","État des lieux écrit + photos datées"],["compteurs","Relevé des compteurs (eau, électricité, gaz) le jour de l'entrée"],["arnona_transfer","Arnona à vos DEUX noms + demande de réduction olim le jour même (pas rétroactif)"],["aide_loyer","Vos deux noms sur le bail (aide au loyer de l'État dès le 7e mois, pour chacun)"],["courtage","Ne rien signer avec un agent sans lire (frais = 1 mois + TVA)"]]],
];
const DEFAULT_PROFILE={
  noms:"Dov et ma cousine", nomsHe:"דב ובת הדודה שלו", signature:"Dov", tel:"", email:"",
  dispos:"tous les jours, dès que possible", disposHe:"בכל יום, מתי שנוח לך", budget:11000, budgetCible:9500, prixMin:8100,
  emploi:"ingénieur biomédical / développeur, et ma cousine travaille aussi", emploiHe:"מהנדס ביו-רפואי ומפתח תוכנה, ובת הדודה שלי עובדת גם",
};

/* ---------- utils ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=v=>{const n=Number(String(v??"").replace(/[^\d.]/g,""));return isFinite(n)&&n>0?n:0};
const fmt=n=>n?n.toLocaleString("fr-FR")+" ₪":"—";
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const nowISO=()=>new Date().toISOString();
const safeUrl=u=>/^https:\/\//i.test(String(u||""))?u:"";
function waNumber(t){let d=String(t||"").replace(/\D/g,"");if(!d)return"";if(d.startsWith("00"))d=d.slice(2);if(d.startsWith("0"))d="972"+d.slice(1);return d}
function waLink(phone,text){const n=waNumber(phone);return "https://wa.me/"+(n||"")+"?text="+encodeURIComponent(text||"")}
function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2600)}
async function copy(text){try{await navigator.clipboard.writeText(text);toast("Copié")}catch(e){toast("Copie impossible ici : sélectionne le texte")}}
function relTime(iso){if(!iso)return"";const d=(Date.now()-new Date(iso))/36e5;if(d<1)return"il y a "+Math.max(1,Math.round(d*60))+" min";if(d<48)return"il y a "+Math.round(d)+" h";return"il y a "+Math.round(d/24)+" j"}
function relDay(d){if(!d)return"";const t=new Date(d);if(isNaN(t))return String(d);const days=Math.floor((Date.now()-t)/864e5);if(days<=0)return"aujourd'hui";if(days===1)return"hier";return"il y a "+days+" j ("+t.toLocaleDateString("fr-FR",{day:"numeric",month:"short"})+")"}
function fmtDT(iso){if(!iso)return"";const d=new Date(iso);if(isNaN(d))return iso;return d.toLocaleString("fr-FR",{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}

/* ---------- store (db capability, localStorage fallback) ---------- */
const state={apts:new Map(),agencies:new Map(),profile:{...DEFAULT_PROFILE},dossier:{},mode:"loading",filter:"actifs",sort:"score",q:"",showAll:false,touched:new Set(),deleted:new Set(),listingsAt:""};
let db=null, mcp=null, sample=null;
const LS="dira-tlv-v1";
function lsLoad(){try{return JSON.parse(localStorage.getItem(LS)||"{}")}catch(e){return{}}}
function lsSave(){if(state.mode!=="local"&&state.mode!=="static")return;
  const keep=a=>state.mode==="local"||state.touched.has(a.id);
  try{localStorage.setItem(LS,JSON.stringify({apts:[...state.apts.values()].filter(keep),agencies:[...state.agencies.values()].filter(keep),profile:state.profile,dossier:state.dossier,deleted:[...state.deleted]}))}catch(e){}}
const store={
  async put(col,id,data){
    const map=col==="apts"?state.apts:state.agencies; map.set(id,{...data,id}); state.touched.add(id);
    if(db){try{await db.collection(col).doc(id).set(stripId(data))}catch(e){writeErr(e)}}else lsSave();
    render();
  },
  async del(col,id){const map=col==="apts"?state.apts:state.agencies;map.delete(id);state.deleted.add(id);state.touched.delete(id);
    if(db){try{await db.collection(col).doc(id).delete()}catch(e){writeErr(e)}}else lsSave(); render()},
  async putDoc(path,data){ if(db){try{await db.doc(path).set(data)}catch(e){writeErr(e)}}else lsSave() }
};
function stripId(d){const o={...d};delete o.id;return o}
function writeErr(e){toast(e&&e.code==="quota_exceeded"?"Base pleine : supprime des annonces abandonnées":"Enregistrement refusé ("+(e&&e.code||"erreur")+")")}
function setSync(kind,text){$("#syncDot").className="dot "+(kind||"");$("#syncText").textContent=text}

async function boot(){
  render();
  const c=window.claude;
  const tryUse=n=>c&&c.use?c.use(n).catch(()=>null):Promise.resolve(null);
  const [d,m,s]=await Promise.all([tryUse("db"),tryUse("mcp"),tryUse("sample")]);
  mcp=m; sample=s;
  if(!d){let base=null;
    if(!c&&/^https?:$/.test(location.protocol)){try{const r=await fetch("data/listings.json",{cache:"no-store"});if(r.ok)base=await r.json()}catch(e){}}
    startLocal(base);return}
  db=d; state.mode="db"; setSync("warn","Chargement…");
  const timer=setTimeout(()=>setSync("warn","Données injoignables pour l'instant"),10000);
  let first=0;const done=()=>{if(++first>=2){clearTimeout(timer);setSync("ok","Partagé · synchro")}};
  db.collection("apts").onSnapshot(snap=>{state.apts=new Map(snap.docs.map(x=>[x.id,{...x.data(),id:x.id}]));if(!snap.metadata.fromCache)done();render()},e=>{clearTimeout(timer);setSync("warn","Synchro coupée ("+e.code+")")});
  db.collection("agencies").onSnapshot(snap=>{state.agencies=new Map(snap.docs.map(x=>[x.id,{...x.data(),id:x.id}]));if(!snap.metadata.fromCache)done();render()},()=>{});
  db.doc("settings/profile").onSnapshot(s=>{if(s.exists)state.profile={...DEFAULT_PROFILE,...s.data()};render()},()=>{});
  db.doc("settings/dossier").onSnapshot(s=>{if(s.exists)state.dossier={...(s.data().checked||{})};render()},()=>{});
}
function startLocal(base){

/* ---------- scoring ---------- */
function totalCost(a){return num(a.prix)+num(a.arnona)+num(a.vaad)}
function score(a){
  const p=state.profile;let s=50;const prix=num(a.prix);
  if(prix&&prix<prixMin())s-=35;
  if(prix){const cible=num(p.budgetCible)||9500,max=num(p.budget)||11000;
    if(prix<=cible-1000)s+=20;else if(prix<=cible)s+=14;else if(prix<=max)s+=4;else s-=25}
  if(a.mamad==="oui")s+=15;else if(a.mamad==="abri")s+=6;else if(a.mamad==="non")s-=8;
  const et=num(a.etage);if(et>=3&&a.ascenseur==="non")s-=12;if(a.ascenseur==="oui")s+=4;
  if(a.balcon)s+=8;if(a.clim)s+=4;if(a.meuble)s+=3;if(a.parking)s+=2;
  if(FAV_Q.includes(a.quartier))s+=6;
  if(a.note)s+=(num(a.note)-3)*6;
  if(num(a.pieces)&&num(a.pieces)<3)s-=20;
  return Math.max(0,Math.min(100,Math.round(s)));
}
function prixMin(){return num(state.profile.prixMin)||8100}
function hiddenByRule(a){const p=num(a.prix);return !!p&&p<prixMin()&&(a.status||"repere")==="repere"}
