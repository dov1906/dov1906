name: Radar feed (Goozali + ATS)

on:
  schedule:
    - cron: "17 13 * * *"   # 13:17 UTC = 15:17 Israel, before the 17:50 radar scan
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests msgpack
      - run: python radar_feed/fetch.py
      - name: Commit feed
        run: |
          git config user.name "radar-feed-bot"
          git config user.email "radar-feed-bot@users.noreply.github.com"
          git add goozali feeds
          git diff --cached --quiet || git commit -m "Radar feed $(date -u +%F)"
          git push
